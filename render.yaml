services:
  - type: web
    name: finvault
    runtime: docker
    repo: https://github.com/AzyShu45/FinVault.git
    branch: main
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 8080
      - key: APP_JWT_SECRET
        generateValue: true
      - key: SPRING_PROFILES_ACTIVE
        value: prod